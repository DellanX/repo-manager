name: CI - Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint-backend:
    name: lint-backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: cd backend && python -m pip install -r requirements.txt

      - name: Run ruff linter
        run: cd backend && python -m ruff check src tests

      - name: Run ruff format check
        run: cd backend && python -m ruff format --check src tests

  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run ESLint
        run: cd frontend && npm run lint

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: lint-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: cd backend && python -m pip install -r requirements.txt

      - name: Install package in editable mode
        run: cd backend && python -m pip install -e .

      - name: Run test suite
        run: cd backend && python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          REPO_MANAGER_WORKSPACE: ${{ runner.temp }}/workspace

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: lint-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run unit tests
        run: cd frontend && npm run test:unit
