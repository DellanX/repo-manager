[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-manager-backend"
version = "0.1.0"
description = "Layered repo manager backend service with Git operations, REST API, WebSocket watch feed, and MCP tool interface."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes correctness checks
  "I",    # import sorting and hygiene
  "B",    # bugbear anti-pattern checks
  "BLE",  # broad-except detection
  "UP",   # pyupgrade checks
  "SIM",  # simplification checks
  "C4",   # comprehensions checks
  "PGH003", # blanket type: ignore checks
  "PGH004", # blanket noqa checks
]

# Keep suppressions localized and explicit.
ignore = []

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = false
