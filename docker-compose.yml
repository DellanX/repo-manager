# Example Docker Compose or Portainer Stack
version: "3.9"

services:
  repo-manager:
    image: ghcr.io/dellanx/repo-manager:latest
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "src.server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8888",
      ]
    volumes:
      - repos:/repos
    environment:
      REPO_MANAGER_WORKSPACE: /repos
    ports:
      - "8888:8888"
      - "2222:22"

volumes:
  repos:
